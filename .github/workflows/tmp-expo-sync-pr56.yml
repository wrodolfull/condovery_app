name: Temporary Expo SDK 57 dependency sync (PR 56)
on:
  push:
    branches:
      - feat/elevadoor-mobile-loading-skeletons-20261106
    paths:
      - .github/workflows/tmp-expo-sync-pr56.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elevadoor-mobile-loading-skeletons-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync Expo SDK 57 package versions and lockfile
        run: npx expo install --fix --npm
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Commit reproducible package lock
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(mobile): align Expo SDK 57 dependencies and lockfile"
          git push origin HEAD:feat/elevadoor-mobile-loading-skeletons-20261106
